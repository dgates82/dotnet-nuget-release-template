name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  # TODO(template): update to match your TargetFrameworks.
  DOTNET_VERSION: '10.0.x'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # TODO(template): ExampleLibrary multi-targets net48;net10.0 to demonstrate the pattern, so this
      # repo's own CI needs Mono to host the net48 test run. If you replace ExampleLibrary
      # with a net8.0/net10.0-only project, this step can be removed.
      - name: Setup Mono
        run: sudo apt-get install -y mono-complete
      # TODO(template): set SONAR_TOKEN, SONAR_PROJECT_KEY, and SONAR_ORG for your
      # own SonarQube Cloud project. SONAR_TOKEN is unset for forked-repo PRs (secrets
      # don't propagate to fork-triggered runs) and for anyone who hasn't set up
      # SonarQube Cloud yet - every step below gated on `env.SONAR_TOKEN != ''` skips
      # cleanly in that case instead of failing the build.
      - name: Set up JDK
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache SonarQube Cloud packages
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@v4
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: ${{ env.SONAR_TOKEN != '' && steps.cache-sonar-scanner.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner
      # workflow_dispatch runs don't get branch auto-detected by the scanner (a known
      # SonarScanner limitation) and silently analyze as if there's no branch at all -
      # pass it explicitly for any non-PR trigger. PR runs already auto-detect correctly
      # via sonar.pullrequest.*, so leave those alone.
      - name: Begin SonarQube Cloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          BRANCH_ARGS=""
          if [ -z "${{ github.event.pull_request.number }}" ]; then
            BRANCH_ARGS="/d:sonar.branch.name=${{ github.ref_name }}"
          fi
          ./.sonar/scanner/dotnet-sonarscanner begin /k:"${{ vars.SONAR_PROJECT_KEY }}" /o:"${{ vars.SONAR_ORG }}" /d:sonar.token="$SONAR_TOKEN" /d:sonar.qualitygate.wait=true /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml" $BRANCH_ARGS
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test --configuration Release --no-build --filter "Category!=Integration" --collect:"XPlat Code Coverage"
      # TODO(template): LocalStack block is required for this template's own example (S3NoteStore).
      # Optional once you replace ExampleLibrary with your own project — keep, adapt to a
      # different service, or delete. Seeding (bucket + starting note) happens automatically
      # via docker/seed.sh, mounted as a LocalStack init hook in docker-compose.yml.
      - name: Start LocalStack
        run: docker compose up -d --wait
      - name: Integration tests
        run: dotnet test --configuration Release --no-build --filter "Category=Integration" --collect:"XPlat Code Coverage"
      - name: Stop LocalStack
        if: always()
        run: docker compose down -v
      - name: End SonarQube Cloud analysis
        id: sonar-end
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      - name: Surface quality gate result
        if: ${{ always() && env.SONAR_TOKEN != '' }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            DASHBOARD_URL="https://sonarcloud.io/dashboard?id=${{ vars.SONAR_PROJECT_KEY }}&pullRequest=${{ github.event.pull_request.number }}"
          else
            DASHBOARD_URL="https://sonarcloud.io/dashboard?id=${{ vars.SONAR_PROJECT_KEY }}&branch=${{ github.ref_name }}"
          fi
          if [ "${{ steps.sonar-end.outcome }}" = "failure" ]; then
            echo "### :x: SonarQube Cloud quality gate FAILED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :white_check_mark: SonarQube Cloud quality gate passed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "[View details on SonarQube Cloud]($DASHBOARD_URL)" >> "$GITHUB_STEP_SUMMARY"
  pack:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Pack
        run: dotnet pack --configuration Release --output ./artifacts
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
